# bionickernel.com — static site on Alibaba Cloud ECS (116.62.81.128)
# TLS material managed by Certbot (certbot.timer).
# Install: copy to /etc/nginx/sites-available/bionickernel.conf, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.

# --- unknown Host / raw IP: refuse -------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/bionickernel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bionickernel.com/privkey.pem;
    return 444;
}

# --- HTTP: ACME challenge passthrough, everything else -> HTTPS --------------
# The challenge location must win over the redirect, otherwise renewal fails.
server {
    listen 80;
    listen [::]:80;
    server_name bionickernel.com www.bionickernel.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bionickernel.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://bionickernel.com$request_uri;
    }
}

# --- HTTPS: canonical host ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    server_name bionickernel.com;

    root /var/www/bionickernel.com;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/bionickernel.access.log;
    error_log  /var/log/nginx/bionickernel.error.log;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/xml application/rss+xml image/svg+xml;
    gzip_min_length 512;

    # HTML revalidates on every request; assets get a short cache.
    expires -1;

    ssl_certificate /etc/letsencrypt/live/bionickernel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bionickernel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# --- HTTPS: www -> canonical host -------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bionickernel.com;

    ssl_certificate /etc/letsencrypt/live/bionickernel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bionickernel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bionickernel.com$request_uri;
}
