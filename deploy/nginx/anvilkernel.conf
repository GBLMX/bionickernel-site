# anvilkernel.com — Anvil project site on the same Alibaba Cloud ECS.
#
# NOT ENABLED YET. Keep this file out of sites-enabled until:
#   1. the ICP filing for anvilkernel.com is approved;
#   2. A/AAAA records point at the ECS;
#   3. the TLS certificate exists under /etc/letsencrypt/live/anvilkernel.com/.
#
# Certificate bootstrap (after DNS and before enabling HTTPS):
#   certbot certonly --webroot -w /var/www/bionickernel.com \
#     -d anvilkernel.com -d www.anvilkernel.com

# --- HTTP: ACME challenge passthrough, everything else -> HTTPS --------------
server {
    listen 80;
    listen [::]:80;
    server_name anvilkernel.com www.anvilkernel.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bionickernel.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://anvilkernel.com$request_uri;
    }
}

# --- HTTPS: canonical host ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    server_name anvilkernel.com;

    root /var/www/bionickernel.com;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/anvilkernel.access.log;
    error_log  /var/log/nginx/anvilkernel.error.log;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    ssl_certificate /etc/letsencrypt/live/anvilkernel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anvilkernel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = / {
        try_files /anvil/index.html =404;
    }

    location / {
        return 302 https://bionickernel.com$request_uri;
    }
}

# --- HTTPS: www -> canonical host -------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.anvilkernel.com;

    ssl_certificate /etc/letsencrypt/live/anvilkernel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anvilkernel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://anvilkernel.com$request_uri;
}
